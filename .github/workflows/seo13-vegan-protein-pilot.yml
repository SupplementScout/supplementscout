name: SEO-13 Vegan Protein Pilot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate only unless the owner explicitly approved apply"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply

permissions:
  contents: read

concurrency:
  group: seo13-vegan-protein-production-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-readonly
    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test exact pilot scope
        run: node --test scripts/seo13-vegan-protein-pilot-executor.test.js scripts/import-products.test.js

      - name: Validate and optionally apply exact two-record pilot
        env:
          SEO13_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          SEO13_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/seo13-vegan-protein-pilot-executor.js --mode=${{ inputs.operation }} --rollout=docs/rollouts/seo13-vegan-protein-pilot/rollout.json --output=tmp/seo13-vegan-protein-pilot/report.json

      - name: Publish result
        if: always()
        run: |
          if [ -f tmp/seo13-vegan-protein-pilot/report.json ]; then
            node -e 'const r=require("./tmp/seo13-vegan-protein-pilot/report.json"); console.log(`## SEO-13 Vegan Protein pilot\n\n- Validated: ${r.validated_plan_count}\n- Executed: ${r.executed_plan_count}\n- Result: PASS`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## SEO-13 Vegan Protein pilot" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Result: BLOCKED (no execution report)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo13-vegan-protein-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/seo13-vegan-protein-pilot/*.json
