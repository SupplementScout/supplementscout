name: 6 Pack Supplements Production Expansion V7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: six-pack-production-family-v7
  cancel-in-progress: false

jobs:
  apply-reviewed-large-family-map:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-readonly
    env:
      NODE_OPTIONS: --use-system-ca
      EXPANSION_CSV: config/retailers/six-pack-production-expansion-v7.csv
      EXPANSION_ROLLOUT: config/retailers/six-pack-production-expansion-v7.json

    steps:
      - name: Validate protected execution context
        run: |
          test "$GITHUB_REPOSITORY" = "SupplementScout/supplementscout"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTIONS" = "true"
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test protected rollout contracts
        run: |
          node --test \
            scripts/import-products.test.js \
            scripts/lib/feed-variant-guards.test.js \
            scripts/six-pack-canary-executor.test.js \
            scripts/six-pack-canary-verify.test.js \
            scripts/six-pack-family-rollout-sealer.test.js \
            scripts/six-pack-large-family-bootstrap.test.js \
            scripts/six-pack-large-family-feed-builder.test.js
      - name: Verify exact approved source checksum
        shell: bash
        run: |
          expected="$(node -p "require('./$EXPANSION_ROLLOUT').csv_sha256")"
          actual="$(sha256sum "$EXPANSION_CSV" | cut -d' ' -f1)"
          test "$actual" = "$expected"
      - name: Fresh production preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPLEMENTSCOUT_IMPORT_RUN_ID: six-pack-production-expansion-v7-preflight
          SUPPLEMENTSCOUT_IMPORT_REPORT_PATH: tmp/six-pack-expansion-v7/preflight-report.json
        run: |
          node scripts/import-products.js --mode=feed --safe-create --dry-run \
            --artifact=tmp/six-pack-expansion-v7/preflight-artifact.json \
            --csv="$EXPANSION_CSV"
      - name: Apply exact approved 75-new plus 2-covered scope
        env:
          SIX_PACK_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          SIX_PACK_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: |
          node scripts/six-pack-canary-executor.js --mode=all \
            --artifact=tmp/six-pack-expansion-v7/preflight-artifact.json \
            --csv="$EXPANSION_CSV" --rollout="$EXPANSION_ROLLOUT" \
            --output=tmp/six-pack-expansion-v7/execution.json
      - name: Fresh idempotency dry-run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPLEMENTSCOUT_IMPORT_RUN_ID: six-pack-production-expansion-v7-idempotency
          SUPPLEMENTSCOUT_IMPORT_REPORT_PATH: tmp/six-pack-expansion-v7/idempotency-report.json
        run: |
          node scripts/import-products.js --mode=feed --safe-create --dry-run \
            --artifact=tmp/six-pack-expansion-v7/idempotency-artifact.json \
            --csv="$EXPANSION_CSV"
      - name: Verify production mappings and offers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/six-pack-canary-verify.js --rollout="$EXPANSION_ROLLOUT" \
            --idempotency=tmp/six-pack-expansion-v7/idempotency-report.json \
            --output=tmp/six-pack-expansion-v7/verification.json
      - name: Publish rollout summary
        if: always()
        run: |
          echo "## 6 Pack Supplements production expansion V7" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/six-pack-expansion-v7/verification.json ]; then
            node -e 'const r=require("./tmp/six-pack-expansion-v7/verification.json"); console.log(`- Result: ${r.result}\n- New mappings: ${r.mapping_count}\n- New offers: ${r.offer_count}\n- Covered duplicate aliases: 2\n- Idempotent plans: ${r.idempotent_plan_count}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Verification unavailable; workflow failed closed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: six-pack-production-expansion-v7-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: tmp/six-pack-expansion-v7/*.json
