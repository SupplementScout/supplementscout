name: 6 Pack Supplements Production Expansion

on:
  push:
    branches:
      - main
    paths:
      - config/retailers/six-pack-production-expansion-v1.json

permissions:
  contents: read

concurrency:
  group: six-pack-production-expansion-v1
  cancel-in-progress: false

jobs:
  apply-six-pack-expansion:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-readonly

    env:
      NODE_OPTIONS: --use-system-ca
      EXPANSION_CSV: config/retailers/six-pack-production-expansion-v1.csv
      EXPANSION_ROLLOUT: config/retailers/six-pack-production-expansion-v1.json

    steps:
      - name: Validate protected execution context
        run: |
          test "$GITHUB_REPOSITORY" = "SupplementScout/supplementscout"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTIONS" = "true"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test protected rollout contracts
        run: |
          node --test \
            scripts/six-pack-canary-executor.test.js \
            scripts/six-pack-canary-verify.test.js

      - name: Verify exact approved source checksum
        shell: bash
        run: |
          expected="$(node -p "require('./$EXPANSION_ROLLOUT').csv_sha256")"
          actual="$(sha256sum "$EXPANSION_CSV" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          test "$expected" = "f3bc0857ba0863bc200138a379d6b15f33332fab2a5e487df1ade56c99d34625"

      - name: Fresh production preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPLEMENTSCOUT_IMPORT_RUN_ID: six-pack-production-expansion-v1
          SUPPLEMENTSCOUT_IMPORT_REPORT_PATH: tmp/six-pack-expansion/preflight-report.json
        run: |
          node scripts/import-products.js \
            --mode=feed \
            --safe-create \
            --dry-run \
            --artifact=tmp/six-pack-expansion/preflight-artifact.json \
            --csv="$EXPANSION_CSV"

      - name: Apply exact approved nine-row scope
        env:
          SIX_PACK_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          SIX_PACK_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: |
          node scripts/six-pack-canary-executor.js \
            --mode=all \
            --artifact=tmp/six-pack-expansion/preflight-artifact.json \
            --csv="$EXPANSION_CSV" \
            --rollout="$EXPANSION_ROLLOUT" \
            --output=tmp/six-pack-expansion/execution.json

      - name: Fresh idempotency dry-run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPLEMENTSCOUT_IMPORT_RUN_ID: six-pack-production-expansion-v1-idempotency
          SUPPLEMENTSCOUT_IMPORT_REPORT_PATH: tmp/six-pack-expansion/idempotency-report.json
        run: |
          node scripts/import-products.js \
            --mode=feed \
            --safe-create \
            --dry-run \
            --artifact=tmp/six-pack-expansion/idempotency-artifact.json \
            --csv="$EXPANSION_CSV"

      - name: Verify production mappings and offers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/six-pack-canary-verify.js \
            --rollout="$EXPANSION_ROLLOUT" \
            --idempotency=tmp/six-pack-expansion/idempotency-report.json \
            --output=tmp/six-pack-expansion/verification.json

      - name: Publish expansion summary
        if: always()
        run: |
          echo "## 6 Pack Supplements production expansion" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/six-pack-expansion/verification.json ]; then
            node -e 'const r=require("./tmp/six-pack-expansion/verification.json"); console.log(`- Result: ${r.result}\n- Retailer ID: ${r.retailer_id}\n- Mappings: ${r.mapping_count}\n- Offers: ${r.offer_count}\n- Idempotent plans: ${r.idempotent_plan_count}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Verification unavailable; workflow failed closed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: six-pack-production-expansion-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: tmp/six-pack-expansion/*.json
