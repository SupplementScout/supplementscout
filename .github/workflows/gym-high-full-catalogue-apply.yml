name: GYM HIGH reviewed full catalogue apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or apply the exact reviewed 66-row catalogue
        required: true
        default: validate
        type: choice
        options: [validate, apply, postflight]
      approval_fingerprint:
        description: Exact reviewed approval fingerprint
        required: true
        type: string
      owner_confirmation:
        description: Exact owner confirmation required only for a manual production apply
        required: false
        type: string
  schedule:
    - cron: "13 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: gym-high-reviewed-full-catalogue-production
  cancel-in-progress: false

jobs:
  catalogue:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.approval_fingerprint == 'e81cf7cc270103733590f3b6195530f0ae8c6441e3ed674c79c9a7bf352b855b' && (inputs.operation != 'apply' || inputs.owner_confirmation == 'OWNER_APPROVED_GYM_HIGH_SHIPPING_POLICY_2026_08_21_EXACT_66')) || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-readonly
    env:
      NODE_OPTIONS: --use-system-ca
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GYM_HIGH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
      GYM_HIGH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
      GYM_HIGH_APPROVAL_FINGERPRINT: ${{ inputs.approval_fingerprint || 'e81cf7cc270103733590f3b6195530f0ae8c6441e3ed674c79c9a7bf352b855b' }}
      GYM_HIGH_OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test exact contracts
        run: node --test scripts/gym-high-catalogue-audit.test.js scripts/gym-high-reviewed-catalogue-bootstrap.test.js scripts/gym-high-full-catalogue-feed-builder.test.js scripts/gym-high-full-catalogue-executor.test.js
      - name: Capture fresh approved source and verify canonical variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node scripts/gym-high-catalogue-audit.js --output=tmp/gym-high-source-monitor/approved-catalogue-report.json; then
            echo "Fresh source is unavailable; recovering the latest successful read-only source-monitor artifact."
            mkdir -p tmp/gym-high-source-monitor/recovery
            run_id="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gym-high-source-monitor.yml/runs?status=success&per_page=1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).workflow_runs?.[0];if(!r)process.exit(1);process.stdout.write(String(r.id))})')"
            artifact_id="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s).artifacts?.find(x=>!x.expired&&x.name.startsWith("gym-high-source-monitor-"));if(!a)process.exit(1);process.stdout.write(String(a.id))})')"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o tmp/gym-high-source-monitor/recovery/source.zip
            unzip -p tmp/gym-high-source-monitor/recovery/source.zip report.json > tmp/gym-high-source-monitor/approved-catalogue-report.json
          fi
          node scripts/gym-high-reviewed-catalogue-bootstrap.js --mode=dry-run --output=tmp/gym-high-reviewed-catalogue/variant-postflight.json
          node -e "const r=require('./tmp/gym-high-reviewed-catalogue/variant-postflight.json');if(r.result!=='PASS'||r.planned_variant_create_count!==0)process.exit(1)"
      - name: Build exact reviewed feed
        run: node scripts/gym-high-full-catalogue-feed-builder.js --source=tmp/gym-high-source-monitor/approved-catalogue-report.json --output=tmp/gym-high-reviewed-catalogue/full-catalogue.csv
      - name: Build immutable full-scope dry-run artifact
        run: node scripts/import-products.js --mode=feed --dry-run --csv=tmp/gym-high-reviewed-catalogue/full-catalogue.csv --artifact=tmp/gym-high-reviewed-catalogue/full-catalogue-artifact.json
      - name: Convert unchanged rows into freshness confirmations
        run: node scripts/gym-high-refresh-artifact.js --report=tmp/gym-high-reviewed-catalogue/full-catalogue-builder-report.json --artifact=tmp/gym-high-reviewed-catalogue/full-catalogue-artifact.json --output=tmp/gym-high-reviewed-catalogue/refresh-artifact.json --output-report=tmp/gym-high-reviewed-catalogue/refresh-report.json
      - name: Validate and optionally apply exact catalogue
        run: node scripts/gym-high-full-catalogue-executor.js --mode=${{ github.event_name == 'schedule' && 'apply' || (inputs.operation == 'apply' && 'apply' || 'validate') }} --report=tmp/gym-high-reviewed-catalogue/refresh-report.json --artifact=tmp/gym-high-reviewed-catalogue/refresh-artifact.json --output=tmp/gym-high-reviewed-catalogue/full-catalogue-execution.json
      - name: Verify complete live postcondition
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' || inputs.operation == 'postflight' }}
        run: |
          node scripts/gym-high-full-catalogue-feed-builder.js --source=tmp/gym-high-source-monitor/approved-catalogue-report.json --output=tmp/gym-high-reviewed-catalogue/post-apply.csv
          node -e "const r=require('./tmp/gym-high-reviewed-catalogue/post-apply-builder-report.json');if(r.result!=='PASS'||r.existing_mapping_count!==66||r.mapping_create_count!==0||r.existing_offer_count!==66||r.offer_create_count!==0)process.exit(1)"
          node scripts/import-products.js --mode=feed --dry-run --csv=tmp/gym-high-reviewed-catalogue/post-apply.csv --artifact=tmp/gym-high-reviewed-catalogue/post-apply-artifact.json
          node -e "const a=require('./tmp/gym-high-reviewed-catalogue/post-apply-artifact.json');const r=require('./tmp/gym-high-reviewed-catalogue/post-apply-builder-report.json');if(a.plans.length!==66||a.plans.some(x=>Date.parse(x.resolved_plan.expected_state.offer.last_checked_at)<Date.parse(r.source_captured_at)))process.exit(1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gym-high-full-catalogue-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/gym-high-reviewed-catalogue/**/*.json
            tmp/gym-high-source-monitor/*.json
          if-no-files-found: warn
          retention-days: 30
