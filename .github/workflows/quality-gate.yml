name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      level:
        description: Verification level
        required: true
        default: full
        type: choice
        options:
          - full
          - integration

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  full:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full deterministic quality gate
        run: npm run verify:full

  integration:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.level == 'integration') || (github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/workflows/quality-gate.yml')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated integration quality gate
        run: npm run verify:integration
