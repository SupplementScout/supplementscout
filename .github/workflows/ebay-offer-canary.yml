name: eBay Offer Canary

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate unless the owner explicitly approved the exact Batch B five apply"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
          - postflight
      owner_confirmation:
        description: "Exact Batch B owner confirmation required; apply is blocked without it"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ebay-offer-canary-bootstrap
  cancel-in-progress: false

jobs:
  canary:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.operation != 'apply' || inputs.owner_confirmation == 'OWNER_APPROVED_EBAY_BATCH_B_EXACT_5') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-readonly
    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run quality gate without production credentials
        run: npm run verify:quick

      - name: Validate and optionally apply the exact reviewed Batch B five
        env:
          EBAY_CANARY_OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
          EBAY_CANARY_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          EBAY_CANARY_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/ebay-offer-canary-executor.js --mode=${{ inputs.operation == 'apply' && 'apply' || 'validate' }} --output=tmp/ebay-offer-canary/execution.json

      - name: Verify exact post-write no-op
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'postflight' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/import-products.js --dry-run --csv=docs/rollouts/ebay-offer-canary/batch-b.csv --artifact=tmp/ebay-offer-canary/postflight.json
          node -e 'const a=require("./tmp/ebay-offer-canary/postflight.json");if(a.blocked_rows.length||a.plans.length!==5||a.plans.some(x=>{const p=x.resolved_plan;return p.product.action!=="existing"||p.product_variant.action!=="existing"||p.retailer.action!=="existing"||p.retailer_product.action!=="noop"||p.offer.action!=="noop"||p.price_history.action!=="noop"}))process.exit(1)'

      - name: Publish result
        if: always()
        run: |
          if [ -f tmp/ebay-offer-canary/execution.json ]; then
            node -e 'const r=require("./tmp/ebay-offer-canary/execution.json");console.log(`## eBay offer canary\n\n- Validated: ${r.validated_plan_count}\n- Executed: ${r.executed_plan_count}\n- Result: PASS`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## eBay offer canary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Result: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ebay-offer-canary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: tmp/ebay-offer-canary/*.json
