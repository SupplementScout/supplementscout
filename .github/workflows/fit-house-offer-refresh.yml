name: Shared Retailer Offer Refresh

on:
  workflow_dispatch:
    inputs:
      retailer:
        description: "Retailer to verify; scheduled runs always cover both"
        required: true
        default: all
        type: choice
        options:
          - all
          - fit-house
          - 10reps
      confirmations_only:
        description: "Require the complete Fit House scope to contain unchanged confirmations only"
        required: true
        default: false
        type: boolean
      operation:
        description: "Refresh mode or exact expired control-plan recovery"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - control-recovery
      control_parent_plan_id:
        description: "Exact expired parent plan UUID; used only for control-recovery"
        required: false
        type: string
      control_retailer_id:
        description: "Exact retailer ID bound to the expired parent plan"
        required: false
        type: string
      control_expected_child_count:
        description: "Exact child count bound to the expired parent plan"
        required: false
        type: string
      control_confirmation:
        description: "Exact owner confirmation for one control-only close"
        required: false
        type: string
      validation_context:
        description: "Diagnostic trigger context; schedule safely emulates the scheduled source path"
        required: true
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - schedule
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: retailer-offer-production-write
  cancel-in-progress: false

jobs:
  fit-house-offer-refresh:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'control-recovery' && (inputs.retailer == 'all' || inputs.retailer == 'fit-house'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-readonly
    outputs:
      artifact_id: ${{ steps.fit_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.fit_artifact.outputs.artifact-digest }}
      source_contract_sha256: ${{ steps.review_source.outputs.contract_sha256 }}
      review_scope_fingerprint: ${{ steps.review_source.outputs.review_scope_fingerprint }}
    env:
      FIT_HOUSE_REFRESH_CONFIRMATIONS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmations_only && 'true' || 'false' }}

    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize diagnostic path
        run: mkdir -p tmp/fit-house-offer-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Fit House automation contracts
        run: node --test scripts/fit-house-offer-refresh.test.js scripts/retailer-offer-sync.test.js

      - name: Dry-run all approved Fit House offers
        env:
          FIT_HOUSE_REFRESH_PHASE: preflight
          FIT_HOUSE_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          FIT_HOUSE_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          FIT_HOUSE_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/fit-house-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Capture Fit House DB baseline read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=fit-house --mode=baseline --output=tmp/fit-house-offer-refresh/production-db-baseline.json

      - name: Apply all approved Fit House offer refresh
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          FIT_HOUSE_REFRESH_PHASE: apply
          FIT_HOUSE_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          FIT_HOUSE_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          FIT_HOUSE_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/fit-house-offer-refresh.js --target=production --mode=apply --isolate-unsafe=true

      - name: Verify Fit House DB postflight read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=fit-house --mode=postflight --baseline=tmp/fit-house-offer-refresh/production-db-baseline.json --execution=tmp/fit-house-offer-refresh/production-apply.json --output=tmp/fit-house-offer-refresh/production-db-postflight.json

      - name: Verify idempotency with a fresh source capture
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          FIT_HOUSE_REFRESH_PHASE: idempotency
          FIT_HOUSE_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          FIT_HOUSE_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          FIT_HOUSE_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/fit-house-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Bind fresh Fit House Review Queue source
        id: review_source
        if: ${{ success() && (github.event_name == 'schedule' || inputs.operation == 'apply') }}
        run: node scripts/fit-house-automation-review-source.js --mode=bind --source-artifact-dir=tmp/fit-house-offer-refresh

      - name: Publish workflow summary
        if: always()
        run: |
          echo "## Fit House approved offer refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/fit-house-offer-refresh/production-apply.json ]; then
            node -e 'const r=require("./tmp/fit-house-offer-refresh/production-apply.json"); console.log(`- Apply: ${r.result}\n- Scope: ${r.scope.offers} offers\n- Actions: ${JSON.stringify(r.classification)}\n- Discovery-only variants: ${r.discovery.new_variants}\n- SAFE_UPDATE: ${r.safe_update}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Apply report unavailable; workflow failed closed before completion." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Fit House refresh evidence
        id: fit_artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fit-house-offer-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/fit-house-offer-refresh/*.json

  refresh-fit-house-review-queue:
    needs: fit-house-offer-refresh
    if: ${{ needs.fit-house-offer-refresh.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply')) && needs.fit-house-offer-refresh.outputs.artifact_id != '' && needs.fit-house-offer-refresh.outputs.artifact_digest != '' && needs.fit-house-offer-refresh.outputs.source_contract_sha256 != '' && needs.fit-house-offer-refresh.outputs.review_scope_fingerprint != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-readonly
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download exact Fit House source evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.fit-house-offer-refresh.outputs.artifact_id }}
          path: tmp/automation-review-reconciliation/fit-house-source
          merge-multiple: true
      - name: Build fresh Fit House Review Queue changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.fit-house-offer-refresh.outputs.artifact_digest }}
        run: >-
          node scripts/fit-house-automation-review-source.js
          --mode=reconcile
          --source-artifact-dir=tmp/automation-review-reconciliation/fit-house-source
          --source-run-id=${{ github.run_id }}
          --source-artifact-id=${{ needs.fit-house-offer-refresh.outputs.artifact_id }}
          --source-commit-sha=${{ github.sha }}
          --source-artifact-digest=${SOURCE_ARTIFACT_DIGEST#sha256:}
          --source-contract-sha256=${{ needs.fit-house-offer-refresh.outputs.source_contract_sha256 }}
          --output=tmp/automation-review-reconciliation/fit-house-reconciliation-dry-run.json
      - name: Publish fresh Fit House cards to Automation Review Queue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/automation-review-reconciliation-apply.js
          --input=tmp/automation-review-reconciliation/fit-house-reconciliation-dry-run.json
          --output=tmp/automation-review-reconciliation/fit-house-reconciliation-apply.json
      - name: Upload Fit House queue refresh evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fit-house-automation-review-queue-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: tmp/automation-review-reconciliation/*.json

  ten-reps-offer-refresh:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'control-recovery' && (inputs.retailer == 'all' || inputs.retailer == '10reps'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-readonly
    env:
      RETAILER_REFRESH_PROFILE: 10reps

    steps:
      - name: Validate protected 10 Reps execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize 10 Reps diagnostic path
        run: mkdir -p tmp/10reps-offer-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test shared retailer automation contracts
        run: node --test scripts/retailer-offer-sync.test.js

      - name: Dry-run all approved 10 Reps offers
        env:
          TEN_REPS_REFRESH_PHASE: preflight
          TEN_REPS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          TEN_REPS_FEED_URL: ${{ secrets.TEN_REPS_FEED_URL }}
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          TEN_REPS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          TEN_REPS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/fit-house-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Capture 10 Reps DB baseline read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=10-reps --mode=baseline --output=tmp/10reps-offer-refresh/production-db-baseline.json

      - name: Apply all approved 10 Reps offer refresh
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          TEN_REPS_REFRESH_PHASE: apply
          TEN_REPS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          TEN_REPS_FEED_URL: ${{ secrets.TEN_REPS_FEED_URL }}
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          TEN_REPS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          TEN_REPS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/fit-house-offer-refresh.js --target=production --mode=apply --isolate-unsafe=true

      - name: Verify 10 Reps DB postflight read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=10-reps --mode=postflight --baseline=tmp/10reps-offer-refresh/production-db-baseline.json --execution=tmp/10reps-offer-refresh/production-apply.json --output=tmp/10reps-offer-refresh/production-db-postflight.json

      - name: Verify 10 Reps idempotency with a fresh source capture
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          TEN_REPS_REFRESH_PHASE: idempotency
          TEN_REPS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          TEN_REPS_FEED_URL: ${{ secrets.TEN_REPS_FEED_URL }}
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          TEN_REPS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          TEN_REPS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/fit-house-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Publish 10 Reps workflow summary
        if: always()
        run: |
          echo "## 10 Reps approved offer refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/10reps-offer-refresh/production-apply.json ]; then
            node -e 'const r=require("./tmp/10reps-offer-refresh/production-apply.json"); console.log(`- Apply: ${r.result}\n- Scope: ${r.scope.offers} offers\n- Actions: ${JSON.stringify(r.classification)}\n- Discovery-only variants: ${r.discovery.new_variants}\n- SAFE_UPDATE: ${r.safe_update}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Apply report unavailable; workflow failed closed before completion." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload 10 Reps refresh evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 10reps-offer-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/10reps-offer-refresh/*.json

  expired-control-plan-recovery:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'control-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readonly

    steps:
      - name: Validate exact control recovery scope
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
          PARENT_PLAN_ID: ${{ inputs.control_parent_plan_id }}
          RETAILER_ID: ${{ inputs.control_retailer_id }}
          EXPECTED_CHILD_COUNT: ${{ inputs.control_expected_child_count }}
          OWNER_CONFIRMATION: ${{ inputs.control_confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          [[ "$PARENT_PLAN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$RETAILER_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_CHILD_COUNT" =~ ^[0-9]+$ ]]
          test "$OWNER_CONFIRMATION" = "OWNER_APPROVED_EXPIRED_CONTROL_CLOSE"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test shared control recovery contract
        run: node --test scripts/retailer-control-plan-recovery.test.js

      - name: Capture exact expired control plan read-only
        env:
          RETAILER_CONTROL_OWNER_DATABASE_URL: ${{ secrets.SUPPLEMENTSCOUT_PRODUCTION_OWNER_DATABASE_URL }}
          PARENT_PLAN_ID: ${{ inputs.control_parent_plan_id }}
          RETAILER_ID: ${{ inputs.control_retailer_id }}
          EXPECTED_CHILD_COUNT: ${{ inputs.control_expected_child_count }}
        run: node scripts/retailer-control-plan-recovery.js --mode=preflight --parent-plan-id="$PARENT_PLAN_ID" --retailer-id="$RETAILER_ID" --expected-child-count="$EXPECTED_CHILD_COUNT" --output=tmp/retailer-control-recovery/preflight.json

      - name: Close exact expired unexecuted control plan
        env:
          RETAILER_CONTROL_OWNER_DATABASE_URL: ${{ secrets.SUPPLEMENTSCOUT_PRODUCTION_OWNER_DATABASE_URL }}
          RETAILER_CONTROL_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          PARENT_PLAN_ID: ${{ inputs.control_parent_plan_id }}
          RETAILER_ID: ${{ inputs.control_retailer_id }}
          EXPECTED_CHILD_COUNT: ${{ inputs.control_expected_child_count }}
          OWNER_CONFIRMATION: ${{ inputs.control_confirmation }}
        run: node scripts/retailer-control-plan-recovery.js --mode=close --parent-plan-id="$PARENT_PLAN_ID" --retailer-id="$RETAILER_ID" --expected-child-count="$EXPECTED_CHILD_COUNT" --input=tmp/retailer-control-recovery/preflight.json --output=tmp/retailer-control-recovery/result.json --confirm="$OWNER_CONFIRMATION"

      - name: Upload control recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retailer-control-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: tmp/retailer-control-recovery/*.json
