name: GYM HIGH Read-only Source Monitor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gym-high-source-monitor.yml
      - config/retailers/gym-high-approved-source-manifest.json
      - config/retailers/gym-high-woocommerce.json
      - scripts/gym-high-source-monitor.js
      - scripts/gym-high-source-monitor.test.js
      - scripts/gym-high-catalogue-audit.js
      - scripts/gym-high-catalogue-audit.test.js
      - scripts/lib/woocommerce-store-api-reader.js
      - scripts/lib/woocommerce-store-api-reader.test.js
      - scripts/lib/woocommerce-product-page-reader.js
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
    - cron: "43 15 * * *"

permissions:
  contents: read

concurrency:
  group: gym-high-source-monitor
  cancel-in-progress: false

jobs:
  source-monitor:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test read-only contracts
        run: node --test scripts/gym-high-source-monitor.test.js scripts/gym-high-catalogue-audit.test.js scripts/lib/woocommerce-product-page-reader.test.js scripts/lib/woocommerce-store-api-reader.test.js
      - name: Capture full public catalogue
        run: |
          delays=(30 60 120 240)
          for attempt in 1 2 3 4 5; do
            if node scripts/gym-high-catalogue-audit.js --output=tmp/gym-high-source-monitor/report.json; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep "${delays[$((attempt - 1))]}"
          done
      - name: Publish summary
        if: always()
        run: |
          echo "## GYM HIGH read-only source monitor" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/gym-high-source-monitor/report.json ]; then
            node -e 'const r=require("./tmp/gym-high-source-monitor/report.json"); console.log(`- Result: ${r.result}\n- Parent products: ${r.parent_product_count}\n- Source rows: ${r.source_row_count}\n- Classifications: ${JSON.stringify(r.classification_counts)}\n- Production writes: ${r.production_writes}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No report: source or identity guard failed closed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gym-high-source-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/gym-high-source-monitor/*.json
