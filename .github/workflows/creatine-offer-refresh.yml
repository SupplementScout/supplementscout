name: Discount Supplements Offer Refresh

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Dry-run only unless an explicitly authorised apply is required"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      validation_context:
        description: "Diagnostic trigger context; schedule safely emulates the scheduled source path"
        required: true
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - schedule
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read

concurrency:
  group: creatine-offer-refresh
  cancel-in-progress: false

jobs:
  creatine-offer-refresh:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This Environment must use a deployment branch policy that permits only main.
    # The policy protects production refresh secrets even if a workflow branch guard changes.
    environment: production-readonly

    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize diagnostic path
        run: mkdir -p tmp/discount-supplements-offer-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Discount refresh contract
        run: node --test scripts/creatine-offer-refresh.test.js scripts/retailer-offer-sync.test.js

      - name: Dry-run authorised Discount offers
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_PHASE: preflight
          DISCOUNT_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/creatine-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Capture Discount Supplements DB baseline read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=discount-supplements --mode=baseline --output=tmp/discount-supplements-offer-refresh/production-db-baseline.json

      - name: Apply safe authorised Discount refresh
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_PHASE: apply
          DISCOUNT_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/creatine-offer-refresh.js --target=production --mode=apply --isolate-unsafe=true

      - name: Verify Discount Supplements DB postflight read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=discount-supplements --mode=postflight --baseline=tmp/discount-supplements-offer-refresh/production-db-baseline.json --execution=tmp/discount-supplements-offer-refresh/production-apply.json --output=tmp/discount-supplements-offer-refresh/production-db-postflight.json

      - name: Verify idempotency with a fresh source capture
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_PHASE: idempotency
          DISCOUNT_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/creatine-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Summarize Discount refresh
        if: always()
        run: |
          echo "## Discount Supplements approved offer refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/discount-supplements-offer-refresh/production-apply.json ]; then
            node -e 'const r=require("./tmp/discount-supplements-offer-refresh/production-apply.json"); console.log(`- Apply: ${r.result}\n- Manifest: ${r.approved_manifest_sha256}\n- Scope: ${r.scope.offers} offers\n- Actions: ${JSON.stringify(r.classification)}\n- Review rows: ${r.review_rows.length}\n- SAFE_UPDATE: ${r.safe_update}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Apply report unavailable; dry-run-only or workflow failed closed before apply." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Discount refresh reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discount-supplements-offer-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/discount-supplements-offer-refresh/*.json
