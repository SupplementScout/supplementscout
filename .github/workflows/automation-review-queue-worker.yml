name: Automation Review Queue Worker

on:
  workflow_dispatch:
    inputs:
      execution_request_id:
        description: "Exact queued execution request UUID; manual runs may never select a batch"
        required: false
        type: string
      recovery_execution_request_id:
        description: "Exact failed request UUID; control-only recovery after verified postflight and fresh idempotency"
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: retailer-offer-production-write
  cancel-in-progress: false

jobs:
  execute-next-approved-review:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && ((github.event.inputs.execution_request_id != '' && github.event.inputs.recovery_execution_request_id == '') || (github.event.inputs.execution_request_id == '' && github.event.inputs.recovery_execution_request_id != '')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-readonly
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test queue worker without production credentials
        run: node --test --test-name-pattern="Automation Review Queue scheduled worker|Review Queue eBay worker|shared retailer Review Queue worker|Fit House Review Queue worker" scripts/admin-auth.test.js
      - name: Remove test-only execution evidence
        run: rm -rf tmp/automation-review-execution && mkdir -p tmp/automation-review-execution
      - name: Audit owner decisions read-only
        if: ${{ github.event_name == 'schedule' || github.event.inputs.recovery_execution_request_id == '' }}
        id: owner_audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-review-owner-decision-audit.js --output=tmp/automation-review-execution/owner-decision-audit.json
      - name: Execute oldest approved queue request
        if: ${{ steps.owner_audit.outcome == 'success' && (github.event_name == 'schedule' || github.event.inputs.recovery_execution_request_id == '') }}
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_UK_DELIVERY_POSTCODE: ${{ secrets.EBAY_UK_DELIVERY_POSTCODE }}
          EBAY_MARKETPLACE_ID: EBAY_GB
          EBAY_EPN_CAMPAIGN_ID: ${{ secrets.EBAY_EPN_CAMPAIGN_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EBAY_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          EBAY_CANARY_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          EBAY_CANARY_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          FIT_HOUSE_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          FIT_HOUSE_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          TEN_REPS_FEED_URL: ${{ secrets.TEN_REPS_FEED_URL }}
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          TEN_REPS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          TEN_REPS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          WHEY_OKAY_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          WHEY_OKAY_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          WHEY_OKAY_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          WHEY_OKAY_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          AUTOMATION_REVIEW_EXECUTION_REQUEST_ID: ${{ github.event.inputs.execution_request_id || '' }}
        run: node scripts/automation-review-queue-worker.js
      - name: Read failed request recovery metadata
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.recovery_execution_request_id != '' }}
        id: recovery_metadata
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOMATION_REVIEW_RECOVERY_REQUEST_ID: ${{ github.event.inputs.recovery_execution_request_id }}
        run: node scripts/automation-review-postflight-recovery.js --mode=metadata --execution-request-id=${{ github.event.inputs.recovery_execution_request_id }} --github-output=$GITHUB_OUTPUT
      - name: Download original execution evidence
        if: ${{ steps.recovery_metadata.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ steps.recovery_metadata.outputs.original_run_id }}
        run: gh run download "$ORIGINAL_RUN_ID" --name "automation-review-queue-worker-${ORIGINAL_RUN_ID}-1" --dir tmp/automation-review-recovery-input
      - name: Recover control status after verified apply
        if: ${{ steps.recovery_metadata.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIT_HOUSE_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          TEN_REPS_FEED_URL: ${{ secrets.TEN_REPS_FEED_URL }}
          TEN_REPS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          WHEY_OKAY_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          WHEY_OKAY_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          AUTOMATION_REVIEW_RECOVERY_REQUEST_ID: ${{ github.event.inputs.recovery_execution_request_id }}
        run: node scripts/automation-review-postflight-recovery.js --mode=recover --execution-request-id=${{ github.event.inputs.recovery_execution_request_id }} --artifact-directory=tmp/automation-review-recovery-input
      - name: Audit owner decisions after recovery
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.recovery_execution_request_id != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-review-owner-decision-audit.js --output=tmp/automation-review-execution/owner-decision-audit.json
      - name: Publish queue monitoring summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = "tmp/automation-review-execution";
          const read = (file) => file && fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : null;
          const audit = read(path.join(directory, "owner-decision-audit.json"));
          const batchName = fs.existsSync(directory) ? fs.readdirSync(directory).find((name) => /^queue-worker-.*-batch\.json$/.test(name)) : null;
          const batch = read(batchName ? path.join(directory, batchName) : null);
          console.log("## Automation Review Queue");
          console.log(`- Monitor status: ${audit?.monitor_status || "FAILED_SYSTEM"}`);
          console.log(`- Pending owner decisions: ${audit?.pending_owner_decision_count ?? "unknown"}`);
          console.log(`- Review attention: ${audit?.review_attention_count ?? "unknown"}`);
          console.log(`- System failures: ${audit?.system_failure_count ?? "unknown"}`);
          console.log(`- Queue processed: ${batch?.processed ?? 0}`);
          console.log(`- Database writes: ${batch?.database_writes ?? 0}`);
          NODE
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automation-review-queue-worker-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: tmp/automation-review-execution/*.json
