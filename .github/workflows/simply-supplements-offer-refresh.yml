name: Simply Supplements Offer Refresh

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Dry-run only unless an explicitly authorised apply is required"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      validation_context:
        description: "Diagnostic trigger context; schedule safely emulates the scheduled source path"
        required: true
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - schedule
  schedule:
    - cron: "7 5 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: retailer-offer-production-write
  cancel-in-progress: false
  queue: max

jobs:
  simply-supplements-offer-refresh:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-readonly
    outputs:
      artifact_id: ${{ steps.source_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.source_artifact.outputs.artifact-digest }}
      source_contract_sha256: ${{ steps.review_source.outputs.contract_sha256 }}
      review_scope_fingerprint: ${{ steps.review_source.outputs.review_scope_fingerprint }}
      publication_mode: ${{ steps.review_source.outputs.publication_mode }}

    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize diagnostic path
        run: mkdir -p tmp/simply-supplements-offer-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Simply Supplements automation contracts
        run: >
          node --test
          scripts/simply-supplements-offer-refresh.test.js
          scripts/simply-supplements-offer-sync-registration.test.js
          scripts/retailer-offer-sync.test.js
          scripts/automation-review-reconciliation-dry-run.test.js

      - name: Dry-run all approved Simply Supplements offers
        env:
          SIMPLY_SUPPLEMENTS_REFRESH_PHASE: preflight
          SIMPLY_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMPLY_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          SIMPLY_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          SIMPLY_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/simply-supplements-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Capture Simply Supplements DB baseline read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          SIMPLY_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=simply-supplements --mode=baseline --output=tmp/simply-supplements-offer-refresh/production-db-baseline.json

      - name: Bind fresh Simply Supplements Review Queue source
        id: review_source
        if: ${{ success() && (github.event_name == 'schedule' || inputs.operation == 'apply') }}
        run: node scripts/shared-retailer-automation-review-source.js --mode=bind --profile=simply-supplements --source-artifact-dir=tmp/simply-supplements-offer-refresh

      - name: Apply approved Simply Supplements offer refresh
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          SIMPLY_SUPPLEMENTS_REFRESH_PHASE: apply
          SIMPLY_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMPLY_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          SIMPLY_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          SIMPLY_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/simply-supplements-offer-refresh.js --target=production --mode=apply --isolate-unsafe=true

      - name: Verify Simply Supplements DB postflight read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          SIMPLY_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=simply-supplements --mode=postflight --baseline=tmp/simply-supplements-offer-refresh/production-db-baseline.json --execution=tmp/simply-supplements-offer-refresh/production-apply.json --output=tmp/simply-supplements-offer-refresh/production-db-postflight.json

      - name: Verify idempotency with a fresh source capture
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          SIMPLY_SUPPLEMENTS_REFRESH_PHASE: idempotency
          SIMPLY_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMPLY_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          SIMPLY_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          SIMPLY_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/simply-supplements-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Publish workflow summary
        if: always()
        run: |
          echo "## Simply Supplements approved offer refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/simply-supplements-offer-refresh/production-apply.json ]; then
            node -e 'const r=require("./tmp/simply-supplements-offer-refresh/production-apply.json"); console.log(`- Apply: ${r.result}\n- Scope: ${r.scope.offers} offers\n- Actions: ${JSON.stringify(r.classification)}\n- Discovery-only variants: ${r.discovery.new_variants}\n- SAFE_UPDATE: ${r.safe_update}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Apply report unavailable; dry-run-only or workflow failed closed before apply." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Simply Supplements refresh evidence
        id: source_artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simply-supplements-offer-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/simply-supplements-offer-refresh/*.json

  refresh-review-queue:
    needs: [simply-supplements-offer-refresh]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && needs.simply-supplements-offer-refresh.outputs.artifact_id != '' && needs.simply-supplements-offer-refresh.outputs.artifact_digest != '' && needs.simply-supplements-offer-refresh.outputs.source_contract_sha256 != '' && needs.simply-supplements-offer-refresh.outputs.review_scope_fingerprint != '' && needs.simply-supplements-offer-refresh.outputs.publication_mode != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-readonly
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile and publish fresh Simply Supplements Review Queue source
        id: publication
        uses: ./.github/actions/publish-automation-review-queue
        with:
          display-name: Simply Supplements
          profile: simply-supplements
          artifact-id: ${{ needs.simply-supplements-offer-refresh.outputs.artifact_id }}
          artifact-digest: ${{ needs.simply-supplements-offer-refresh.outputs.artifact_digest }}
          source-contract-sha256: ${{ needs.simply-supplements-offer-refresh.outputs.source_contract_sha256 }}
          source-directory: tmp/automation-review-reconciliation/simply-source
          evidence-prefix: simply-supplements
          source-run-id: ${{ github.run_id }}
          source-commit-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          durable-sealed-artifacts-enforcement: ${{ vars.DURABLE_SEALED_ARTIFACTS_ENFORCEMENT }}
      - name: Verify Review Queue publication receipt
        env:
          PUBLICATION_STATUS: ${{ steps.publication.outputs.publication-status }}
          RECEIPT_SHA256: ${{ steps.publication.outputs.receipt-sha256 }}
          REFRESH_RESULT: ${{ needs.simply-supplements-offer-refresh.result }}
        run: |
          test "$REFRESH_RESULT" = "success"
          case "$PUBLICATION_STATUS" in APPLIED|ALREADY_APPLIED) ;; *) exit 1 ;; esac
          test "${#RECEIPT_SHA256}" = "64"
          printf '%s  %s\n' "$RECEIPT_SHA256" "tmp/automation-review-reconciliation/simply-supplements-reconciliation-apply.json" | sha256sum --check --strict
      - name: Upload Simply Supplements queue evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simply-supplements-review-queue-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: tmp/automation-review-reconciliation/*.json
