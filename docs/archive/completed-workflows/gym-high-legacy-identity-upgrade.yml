name: GYM HIGH reviewed legacy identity upgrade

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or apply the exact remaining reviewed mappings
        required: true
        default: validate
        type: choice
        options: [validate, apply]
      approval_fingerprint:
        description: Exact reviewed approval fingerprint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gym-high-reviewed-legacy-identity-production
  cancel-in-progress: false

jobs:
  upgrade:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.approval_fingerprint == 'feda6c5cc6f03556dbadfb2e56dc7216150d502a70cee03b1880ec35ec37ad59' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-readonly
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GYM_HIGH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
      GYM_HIGH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
      GYM_HIGH_APPROVAL_FINGERPRINT: ${{ inputs.approval_fingerprint }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test exact contracts
        run: node --test scripts/gym-high-legacy-identity-feed-builder.test.js scripts/gym-high-legacy-identity-executor.test.js scripts/gym-high-no-sku-legacy-migration.test.js
      - name: Capture approved source and verify canonical variants
        run: |
          node scripts/gym-high-catalogue-audit.js --output=tmp/gym-high-source-monitor/approved-catalogue-report.json
          node scripts/gym-high-reviewed-catalogue-bootstrap.js --mode=dry-run --output=tmp/gym-high-reviewed-catalogue/variant-postflight.json
          node -e "const r=require('./tmp/gym-high-reviewed-catalogue/variant-postflight.json');if(r.result!=='PASS'||r.planned_variant_create_count!==0)process.exit(1)"
      - name: Build remaining exact identity feeds
        run: node scripts/gym-high-legacy-identity-feed-builder.js --output=tmp/gym-high-reviewed-catalogue/legacy-identity-upgrade.csv
      - name: Build immutable one-row dry-run artifacts
        shell: bash
        run: |
          mkdir -p tmp/gym-high-reviewed-catalogue/identity-plans
          for csv in tmp/gym-high-reviewed-catalogue/legacy-identity-upgrade-rows/*.csv; do
            [ -e "$csv" ] || continue
            base="$(basename "$csv" .csv)"
            node scripts/import-products.js --mode=feed --dry-run --csv="$csv" --artifact="tmp/gym-high-reviewed-catalogue/identity-plans/$base.json"
          done
      - name: Validate and optionally apply exact remaining mappings
        run: node scripts/gym-high-legacy-identity-executor.js --mode=${{ inputs.operation }} --report=tmp/gym-high-reviewed-catalogue/legacy-identity-upgrade-builder-report.json --artifacts=tmp/gym-high-reviewed-catalogue/identity-plans --output=tmp/gym-high-reviewed-catalogue/identity-execution.json
      - name: Verify apply postcondition
        if: ${{ inputs.operation == 'apply' }}
        run: |
          node scripts/gym-high-legacy-identity-feed-builder.js --output=tmp/gym-high-reviewed-catalogue/post-identity-upgrade.csv
          node -e "const r=require('./tmp/gym-high-reviewed-catalogue/post-identity-upgrade-builder-report.json');if(r.result!=='PASS'||r.remaining_upgrade_count!==0||r.completed_mapping_count!==21)process.exit(1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gym-high-legacy-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/gym-high-reviewed-catalogue/**/*.json
          if-no-files-found: error
          retention-days: 30
