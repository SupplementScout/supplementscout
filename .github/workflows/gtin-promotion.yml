name: Guarded GTIN promotion

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Test only, validate production, or release an explicitly supported owner-approved scope
        required: true
        default: preflight
        type: choice
        options: [preflight, preflight_exact_36, deploy_exact_36_migration, validate, apply, release_exact_45]
      owner_confirmation:
        description: Type the exact confirmation required by the selected operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guarded-gtin-promotion-production
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ github.ref == 'refs/heads/main' && ((inputs.operation == 'preflight_exact_36' && inputs.owner_confirmation == 'OWNER_APPROVED_EXACT_36') || (inputs.operation == 'deploy_exact_36_migration' && inputs.owner_confirmation == 'OWNER_APPROVED_EXACT_36_MIGRATION') || (inputs.operation != 'preflight_exact_36' && inputs.operation != 'deploy_exact_36_migration' && inputs.owner_confirmation == 'OWNER_APPROVED_EXACT_45')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: PRECHECK — full project quality gate
        run: npm run verify:full
      - name: PRECHECK — exact contracts and workflow
        run: node --test scripts/gtin-promotion.test.js scripts/gtin-promotion-operation.test.js scripts/gtin-promotion-migration.test.js scripts/gtin-promotion-workflow.test.js scripts/gtin-promotion-release.test.js
      - name: PostgreSQL integration test
        env:
          GTIN_PROMOTION_REQUIRE_DOCKER: "true"
        run: node --test scripts/gtin-promotion-postgres.integration.test.js

  production:
    needs: integration
    if: ${{ inputs.operation != 'preflight' && inputs.operation != 'preflight_exact_36' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-readonly
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Materialize protected owner credential file
        env:
          GTIN_OWNER_ENV_FILE: ${{ runner.temp }}/gtin-production-owner.env
          PRODUCTION_PROJECT_REF: aftboxmrdgyhizicfsfu
          PRODUCTION_OWNER_DATABASE_URL: ${{ secrets.SUPPLEMENTSCOUT_PRODUCTION_OWNER_DATABASE_URL }}
        run: node -e "require('node:fs').writeFileSync(process.env.GTIN_OWNER_ENV_FILE,'SUPPLEMENTSCOUT_PRODUCTION_PROJECT_REF='+process.env.PRODUCTION_PROJECT_REF+'\nSUPPLEMENTSCOUT_PRODUCTION_OWNER_DATABASE_URL='+process.env.PRODUCTION_OWNER_DATABASE_URL+'\n',{mode:0o600})"
      - name: Production preflight — build fresh exact artifact
        if: ${{ inputs.operation != 'deploy_exact_36_migration' }}
        env:
          NODE_OPTIONS: --use-system-ca
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run gtin:promotion -- --mode=plan --target=production --output=tmp/gtin-promotion/release-exact-45.json
      - name: Production preflight — seal no-change baseline
        if: ${{ inputs.operation != 'deploy_exact_36_migration' }}
        env:
          NODE_OPTIONS: --use-system-ca
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gtin-promotion-release.js --mode=capture --target=production --artifact=tmp/gtin-promotion/release-exact-45.json --output=tmp/gtin-promotion/release-baseline.json --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_45
      - name: Exact-36 migration preflight
        if: ${{ inputs.operation == 'deploy_exact_36_migration' }}
        run: node scripts/gtin-promotion-release.js --mode=exact36-migration-preflight --target=production --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_36_MIGRATION
      - name: Deploy exact-36 migration only
        if: ${{ inputs.operation == 'deploy_exact_36_migration' }}
        run: node scripts/gtin-promotion-release.js --mode=exact36-deploy --target=production --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_36_MIGRATION
      - name: Verify exact-36 migration deployment
        if: ${{ inputs.operation == 'deploy_exact_36_migration' }}
        run: node scripts/gtin-promotion-release.js --mode=exact36-migration-preflight --target=production --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_36_MIGRATION
      - name: Migration preflight
        if: ${{ inputs.operation == 'release_exact_45' }}
        run: node scripts/gtin-promotion-release.js --mode=migration-preflight --target=production --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_45
      - name: Deploy exact reviewed migration or verify it is already present
        if: ${{ inputs.operation == 'release_exact_45' }}
        run: node scripts/gtin-promotion-release.js --mode=deploy --target=production --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_45
      - name: Validate exact 45 after migration
        if: ${{ inputs.operation != 'deploy_exact_36_migration' }}
        env:
          GTIN_PROMOTION_APPROVER_DATABASE_URL: ${{ secrets.GTIN_PROMOTION_APPROVER_DATABASE_URL || secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          GTIN_PROMOTION_EXECUTOR_DATABASE_URL: ${{ secrets.GTIN_PROMOTION_EXECUTOR_DATABASE_URL || secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: npm run gtin:promotion -- --mode=validate --target=production --artifact=tmp/gtin-promotion/release-exact-45.json --confirm=OWNER_APPROVED_EXACT_45
      - name: Apply exact 45 atomically
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'release_exact_45' }}
        env:
          GTIN_PROMOTION_APPROVER_DATABASE_URL: ${{ secrets.GTIN_PROMOTION_APPROVER_DATABASE_URL || secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          GTIN_PROMOTION_EXECUTOR_DATABASE_URL: ${{ secrets.GTIN_PROMOTION_EXECUTOR_DATABASE_URL || secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: npm run gtin:promotion -- --mode=apply --target=production --artifact=tmp/gtin-promotion/release-exact-45.json --confirm=OWNER_APPROVED_EXACT_45
      - name: Post-write verification
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'release_exact_45' }}
        env:
          NODE_OPTIONS: --use-system-ca
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gtin-promotion-release.js --mode=verify --target=production --artifact=tmp/gtin-promotion/release-exact-45.json --baseline=tmp/gtin-promotion/release-baseline.json --output=tmp/gtin-promotion/release-report.json --env-file=$RUNNER_TEMP/gtin-production-owner.env --confirm=OWNER_APPROVED_EXACT_45
      - name: Remove owner credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/gtin-production-owner.env"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gtin-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/gtin-promotion/**
          if-no-files-found: warn
          retention-days: 90
