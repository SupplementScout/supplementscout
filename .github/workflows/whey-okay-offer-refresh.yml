name: Whey Okay Offer Refresh

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Dry-run only unless an explicitly authorised apply is required"
        required: true
        default: select-operation
        type: choice
        options:
          - select-operation
          - dry-run
          - apply
          - reviewed-offer-73-dry-run
          - reviewed-artifact-apply
      validation_context:
        description: "Diagnostic trigger context; schedule safely emulates the scheduled source path"
        required: true
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - schedule
      reviewed_contract:
        description: "Exact JSON contract for reviewed-artifact-apply; leave empty for other operations"
        required: false
        type: string
      owner_confirmation:
        description: "OWNER_APPROVED_REVIEWED_ARTIFACT:<bound SHA-256>; leave empty for other operations"
        required: false
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: whey-okay-offer-refresh
  cancel-in-progress: false

jobs:
  route-operation:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.route.outputs.operation }}
      validation_context: ${{ steps.route.outputs.validation_context }}
      run_standard_refresh: ${{ steps.route.outputs.run_standard_refresh }}
      run_reviewed_offer_73: ${{ steps.route.outputs.run_reviewed_offer_73 }}
      run_reviewed_artifact_apply: ${{ steps.route.outputs.run_reviewed_artifact_apply }}
      run_standard_apply: ${{ steps.route.outputs.run_standard_apply }}
      reviewed_contract: ${{ steps.route.outputs.reviewed_contract }}
      owner_confirmation: ${{ steps.route.outputs.owner_confirmation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Route exact workflow event payload
        id: route
        run: node scripts/whey-okay-workflow-router.js

  whey-okay-offer-refresh:
    needs: route-operation
    if: ${{ needs.route-operation.outputs.run_standard_refresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-readonly

    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize diagnostic path
        run: mkdir -p tmp/whey-okay-offer-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Whey Okay automation contracts
        run: >
          node --test
          scripts/ekm-google-product-feed-reader.test.js
          scripts/whey-okay-offer-refresh.test.js
          scripts/reviewed-variant-create-rebind-offer-update.test.js
          scripts/whey-okay-sync-plan-registration.test.js
          scripts/retailer-offer-sync.test.js
          scripts/retailer-offer-sync-matrix.test.js
          scripts/jons-offer-refresh.test.js
          scripts/jons-sync-plan-registration.test.js
          scripts/adapters/jons-supplements.test.js

      - name: Dry-run all approved Whey Okay offers
        env:
          WHEY_OKAY_REFRESH_PHASE: preflight
          WHEY_OKAY_REFRESH_TRIGGER_TYPE: ${{ needs.route-operation.outputs.validation_context }}
          WHEY_OKAY_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          WHEY_OKAY_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          WHEY_OKAY_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/whey-okay-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Capture Whey Okay DB baseline read-only
        if: ${{ needs.route-operation.outputs.run_standard_apply == 'true' }}
        env:
          WHEY_OKAY_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=whey-okay --mode=baseline --output=tmp/whey-okay-offer-refresh/production-db-baseline.json

      - name: Apply all approved Whey Okay offer refreshes
        if: ${{ needs.route-operation.outputs.run_standard_apply == 'true' }}
        env:
          WHEY_OKAY_REFRESH_PHASE: apply
          WHEY_OKAY_REFRESH_TRIGGER_TYPE: ${{ needs.route-operation.outputs.validation_context }}
          WHEY_OKAY_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          WHEY_OKAY_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          WHEY_OKAY_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/whey-okay-offer-refresh.js --target=production --mode=apply --isolate-unsafe=true --preflight-artifact=tmp/whey-okay-offer-refresh/production-preflight-immutable.json

      - name: Verify Whey Okay DB postflight read-only
        if: ${{ needs.route-operation.outputs.run_standard_apply == 'true' }}
        env:
          WHEY_OKAY_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=whey-okay --mode=postflight --baseline=tmp/whey-okay-offer-refresh/production-db-baseline.json --execution=tmp/whey-okay-offer-refresh/production-apply-apply.json --output=tmp/whey-okay-offer-refresh/production-db-postflight.json

      - name: Verify idempotency with a fresh source capture
        if: ${{ needs.route-operation.outputs.run_standard_apply == 'true' }}
        env:
          WHEY_OKAY_REFRESH_PHASE: idempotency
          WHEY_OKAY_REFRESH_TRIGGER_TYPE: ${{ needs.route-operation.outputs.validation_context }}
          WHEY_OKAY_SYNC_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          WHEY_OKAY_SYNC_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          WHEY_OKAY_SYNC_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/whey-okay-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Publish workflow summary
        if: always()
        run: |
          echo "## Whey Okay approved offer refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/whey-okay-offer-refresh/production-apply-apply.json ]; then
            node -e 'const r=require("./tmp/whey-okay-offer-refresh/production-apply-apply.json"); console.log(`- Apply: ${r.result}\n- Manifest: ${r.manifest.sha256}\n- Scope: ${r.scope.offers} offers\n- Actions: ${JSON.stringify(r.classification)}\n- Discovery-only rows: ${r.discovery.new_rows}\n- Shipping mutations: ${r.shipping_differences.mutations}\n- SAFE_UPDATE: ${r.safe_update}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Apply report unavailable; dry-run-only or workflow failed closed before apply." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Whey Okay refresh evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: whey-okay-offer-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/whey-okay-offer-refresh/

  reviewed-offer-73-dry-run:
    needs: route-operation
    if: ${{ needs.route-operation.outputs.run_reviewed_offer_73 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readonly

    steps:
      - name: Validate reviewed offer 73 routing
        env:
          REQUESTED_OPERATION: ${{ needs.route-operation.outputs.operation }}
          VALIDATION_CONTEXT: ${{ needs.route-operation.outputs.validation_context }}
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$REQUESTED_OPERATION" = "reviewed-offer-73-dry-run"
          test "$VALIDATION_CONTEXT" = "workflow_dispatch"
          echo "Requested operation: $REQUESTED_OPERATION"
          echo "Validation context: $VALIDATION_CONTEXT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test reviewed offer 73 contracts
        run: >
          node --test
          scripts/ekm-google-product-feed-reader.test.js
          scripts/reviewed-variant-create-rebind-offer-update.test.js
          scripts/whey-okay-sync-plan-registration.test.js

      - name: Initialize reviewed evidence path
        run: mkdir -p tmp/whey-okay-offer-refresh

      - name: Build immutable reviewed offer 73 dry-run
        env:
          WHEY_OKAY_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: >-
          node scripts/whey-okay-offer-73-reviewed-dry-run.js
          --mode=dry-run
          --output=tmp/whey-okay-offer-refresh/reviewed-offer-73-plan.json

      - name: Upload reviewed offer 73 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whey-okay-offer-73-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/whey-okay-offer-refresh/

  validate-reviewed-artifact:
    needs: route-operation
    if: ${{ needs.route-operation.outputs.run_reviewed_artifact_apply == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readonly
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact reviewed implementation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download and validate exact reviewed source artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_CONTRACT_JSON: ${{ needs.route-operation.outputs.reviewed_contract }}
          OWNER_CONFIRMATION: ${{ needs.route-operation.outputs.owner_confirmation }}
        run: node scripts/reviewed-artifact-orchestrator.js --mode=download
      - name: Capture exact reviewed DB baseline read-only
        env:
          REVIEWED_CONTRACT_JSON: ${{ needs.route-operation.outputs.reviewed_contract }}
          REVIEWED_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/reviewed-artifact-orchestrator.js --mode=baseline
      - name: Upload immutable reviewed validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whey-okay-reviewed-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/reviewed-artifact-apply/

  approve-reviewed-artifact:
    needs: [route-operation, validate-reviewed-artifact]
    if: ${{ needs.route-operation.outputs.run_reviewed_artifact_apply == 'true' && needs.validate-reviewed-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download validated reviewed evidence
        uses: actions/download-artifact@v8
        with:
          name: whey-okay-reviewed-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/reviewed-artifact-apply
      - name: Approve exact reviewed plan once
        env:
          REVIEWED_CONTRACT_JSON: ${{ needs.route-operation.outputs.reviewed_contract }}
          OWNER_CONFIRMATION: ${{ needs.route-operation.outputs.owner_confirmation }}
          REVIEWED_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
        run: node scripts/reviewed-artifact-orchestrator.js --mode=approve
      - name: Upload reviewed approval evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whey-okay-reviewed-approval-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/reviewed-artifact-apply/approval.json

  execute-reviewed-artifact:
    needs: [route-operation, validate-reviewed-artifact, approve-reviewed-artifact]
    if: ${{ needs.route-operation.outputs.run_reviewed_artifact_apply == 'true' && needs.approve-reviewed-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download reviewed validation and approval evidence
        uses: actions/download-artifact@v8
        with:
          pattern: whey-okay-reviewed-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: tmp/reviewed-artifact-apply
      - name: Execute exact reviewed plan atomically once
        env:
          REVIEWED_CONTRACT_JSON: ${{ needs.route-operation.outputs.reviewed_contract }}
          OWNER_CONFIRMATION: ${{ needs.route-operation.outputs.owner_confirmation }}
          REVIEWED_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
        run: node scripts/reviewed-artifact-orchestrator.js --mode=execute
      - name: Upload reviewed execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whey-okay-reviewed-execution-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/reviewed-artifact-apply/execution.json

  postflight-reviewed-artifact:
    needs: [route-operation, validate-reviewed-artifact, approve-reviewed-artifact, execute-reviewed-artifact]
    if: ${{ always() && needs.route-operation.outputs.run_reviewed_artifact_apply == 'true' && needs.execute-reviewed-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download full reviewed execution evidence
        uses: actions/download-artifact@v8
        with:
          pattern: whey-okay-reviewed-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: tmp/reviewed-artifact-apply
      - name: Verify reviewed DB postflight and idempotency read-only
        env:
          REVIEWED_CONTRACT_JSON: ${{ needs.route-operation.outputs.reviewed_contract }}
          REVIEWED_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/reviewed-artifact-orchestrator.js --mode=postflight
      - name: Upload reviewed postflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whey-okay-reviewed-postflight-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: tmp/reviewed-artifact-apply/postflight.json
