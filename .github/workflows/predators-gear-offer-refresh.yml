name: Predators Gear Offer Refresh Read-only Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predators-gear-offer-refresh-readonly
  cancel-in-progress: false

jobs:
  predators-gear-readonly-proof:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-readonly

    steps:
      - name: Validate protected read-only context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Test exact Predators Gear read-only contracts
        run: node --test scripts/predators-gear-offer-refresh.test.js scripts/retailer-offer-sync.test.js

      - name: Dry-run the exact approved Predators Gear offers read-only
        env:
          PREDATORS_GEAR_REFRESH_PHASE: source-proof
          PREDATORS_GEAR_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/predators-gear-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true

      - name: Upload Predators Gear read-only evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: predators-gear-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/predators-gear-offer-refresh/*.json
