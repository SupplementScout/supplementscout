name: Discount Supplements Offer Refresh

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Dry-run only unless an explicitly authorised apply is required"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - review-only
          - apply
      validation_context:
        description: "Diagnostic trigger context; schedule safely emulates the scheduled source path"
        required: true
        default: workflow_dispatch
        type: choice
        options:
          - workflow_dispatch
          - schedule
      scope_segment:
        description: "Approved immutable segment; scheduled runs always use the complete 109-offer scope"
        required: true
        default: combined_109
        type: choice
        options:
          - combined_109
          - group_a_freshness_95
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: creatine-offer-refresh
  cancel-in-progress: false

jobs:
  creatine-offer-refresh:
    outputs:
      review_artifact_id: ${{ steps.review_evidence.outputs.artifact-id }}
      review_artifact_digest: ${{ steps.review_evidence.outputs.artifact-digest }}
      review_contract_sha256: ${{ steps.review_source.outputs.contract_sha256 }}
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This Environment must use a deployment branch policy that permits only main.
    # The policy protects production refresh secrets even if a workflow branch guard changes.
    environment: production-readonly

    steps:
      - name: Validate protected execution context
        env:
          EXPECTED_REPOSITORY: SupplementScout/supplementscout
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize diagnostic path
        run: mkdir -p tmp/discount-supplements-offer-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Discount refresh contract
        run: node --test scripts/creatine-offer-refresh.test.js scripts/retailer-offer-sync.test.js

      - name: Dry-run authorised Discount offers
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_PHASE: preflight
          DISCOUNT_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_EXECUTION_SCOPE_SEGMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_segment || '' }}
        run: |
          SCOPE_ARG=""
          if [ "$DISCOUNT_SUPPLEMENTS_EXECUTION_SCOPE_SEGMENT" = "group_a_freshness_95" ]; then SCOPE_ARG="--scope-segment=group_a_freshness_95"; fi
          node scripts/creatine-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true $SCOPE_ARG

      - name: Capture Discount Supplements DB baseline read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' || inputs.operation == 'review-only' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=discount-supplements --mode=baseline --output=tmp/discount-supplements-offer-refresh/production-db-baseline.json

      - name: Bind fresh Review Queue source
        id: review_source
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' || inputs.operation == 'review-only' }}
        run: node scripts/shared-retailer-automation-review-source.js --mode=bind --profile=discount-supplements --source-artifact-dir=tmp/discount-supplements-offer-refresh
      - name: Upload immutable Review Queue source
        id: review_evidence
        if: ${{ steps.review_source.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: discount-supplements-offer-refresh-review-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/discount-supplements-offer-refresh/automation-review-*
          retention-days: 14
          if-no-files-found: error
      - name: Apply safe authorised Discount refresh
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_PHASE: apply
          DISCOUNT_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_EXECUTION_SCOPE_SEGMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_segment || '' }}
        run: |
          SCOPE_ARG=""
          if [ "$DISCOUNT_SUPPLEMENTS_EXECUTION_SCOPE_SEGMENT" = "group_a_freshness_95" ]; then SCOPE_ARG="--scope-segment=group_a_freshness_95"; fi
          node scripts/creatine-offer-refresh.js --target=production --mode=apply --isolate-unsafe=true $SCOPE_ARG

      - name: Verify Discount Supplements DB postflight read-only
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
        run: node scripts/retailer-offer-refresh-postflight.js --profile=discount-supplements --mode=postflight --baseline=tmp/discount-supplements-offer-refresh/production-db-baseline.json --execution=tmp/discount-supplements-offer-refresh/production-apply.json --output=tmp/discount-supplements-offer-refresh/production-db-postflight.json

      - name: Verify idempotency with a fresh source capture
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'apply' }}
        env:
          DISCOUNT_SUPPLEMENTS_REFRESH_PHASE: idempotency
          DISCOUNT_SUPPLEMENTS_REFRESH_TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.validation_context }}
          DISCOUNT_SUPPLEMENTS_REFRESH_VALIDATOR_DATABASE_URL: ${{ secrets.JONS_SYNC_VALIDATOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_APPROVER_DATABASE_URL: ${{ secrets.JONS_SYNC_APPROVER_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_REFRESH_EXECUTOR_DATABASE_URL: ${{ secrets.JONS_SYNC_EXECUTOR_DATABASE_URL }}
          DISCOUNT_SUPPLEMENTS_EXECUTION_SCOPE_SEGMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_segment || '' }}
        run: |
          SCOPE_ARG=""
          if [ "$DISCOUNT_SUPPLEMENTS_EXECUTION_SCOPE_SEGMENT" = "group_a_freshness_95" ]; then SCOPE_ARG="--scope-segment=group_a_freshness_95"; fi
          node scripts/creatine-offer-refresh.js --target=production --mode=dry-run --isolate-unsafe=true $SCOPE_ARG

      - name: Summarize Discount refresh
        if: always()
        run: |
          echo "## Discount Supplements approved offer refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tmp/discount-supplements-offer-refresh/production-apply.json ]; then
            node -e 'const r=require("./tmp/discount-supplements-offer-refresh/production-apply.json"); console.log(`- Apply: ${r.result}\n- Manifest: ${r.approved_manifest_sha256}\n- Scope: ${r.scope.offers} offers\n- Actions: ${JSON.stringify(r.classification)}\n- Review rows: ${r.review_rows.length}\n- SAFE_UPDATE: ${r.safe_update}`)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Apply report unavailable; dry-run-only or workflow failed closed before apply." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Discount refresh reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discount-supplements-offer-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: tmp/discount-supplements-offer-refresh/*.json

  refresh-review-queue:
    needs: [creatine-offer-refresh]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.creatine-offer-refresh.outputs.review_artifact_id != '' && needs.creatine-offer-refresh.outputs.review_artifact_digest != '' && needs.creatine-offer-refresh.outputs.review_contract_sha256 != '' }}
    runs-on: ubuntu-latest
    environment: production-readonly
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish verified conflicts to Automation Review Queue
        uses: ./.github/actions/publish-automation-review-queue
        with:
          display-name: discount-supplements
          profile: discount-supplements
          artifact-id: ${{ needs.creatine-offer-refresh.outputs.review_artifact_id }}
          artifact-digest: ${{ needs.creatine-offer-refresh.outputs.review_artifact_digest }}
          source-contract-sha256: ${{ needs.creatine-offer-refresh.outputs.review_contract_sha256 }}
          source-directory: tmp/discount-supplements-offer-refresh/review-publication-source
          evidence-prefix: discount-supplements
          source-run-id: ${{ github.run_id }}
          source-commit-sha: ${{ github.sha }}
          github-token: ${{ github.token }}
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          durable-sealed-artifacts-enforcement: ${{ vars.DURABLE_SEALED_ARTIFACTS_ENFORCEMENT }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discount-supplements-automation-review-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/automation-review-reconciliation/*.json
          retention-days: 14
          if-no-files-found: warn
